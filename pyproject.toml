[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-api-repair-sample"
version = "1.0.0"
description = "Dependency-free demonstration of bounded retries, safe pagination, and atomic CSV output."
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
